<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>艾葆國際認證中心EDM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">◆</span>
        <span class="logo-text">EDM 展示中心</span>
      </div>
      <nav class="header-nav">
        <span class="nav-label">最新 <em id="edm-count">0</em> 份電子報</span>
      </nav>
    </div>
    <div class="header-rule"></div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">ELECTRONIC DIRECT MAIL</p>
      <h1 class="hero-title">認證<br/><em>電子報</em></h1>
      <p class="hero-sub">把努力，變成被看見的證明</p>
    </div>
    <div class="hero-line"></div>
  </section>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-inner">
      <span class="filter-label">篩選：</span>
      <div class="filter-tags" id="filter-tags">
        <button class="tag active" data-tag="all">全部</button>
      </div>
    </div>
  </div>

  <!-- EDM Grid -->
  <main class="edm-grid-section">
    <div class="edm-grid" id="edm-grid">
      <!-- Cards rendered by JS -->
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <p>目前沒有符合條件的電子報。</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" id="lb-backdrop"></div>
    <div class="lightbox-panel">
      <button class="lb-close" id="lb-close" aria-label="關閉">✕</button>
      <div class="lb-meta">
        <span class="lb-tag" id="lb-tag"></span>
        <h2 class="lb-title" id="lb-title"></h2>
        <p class="lb-date" id="lb-date"></p>
        <p class="lb-desc" id="lb-desc"></p>
      </div>
      <div class="lb-preview">
        <iframe id="lb-iframe" title="EDM 預覽" sandbox="allow-same-origin"></iframe>
      </div>
      <div class="lb-actions">
        <a class="lb-btn" id="lb-open" target="_blank" rel="noopener">在新分頁開啟 ↗</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© <span id="yr"></span> EDM 展示中心 · 由 JYIC 提供服務</p>
  </footer>

  <script src="edm-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
